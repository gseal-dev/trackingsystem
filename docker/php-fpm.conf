[www]
; let PHP see the container's environment variables (database password, ...)
clear_env = no
; show PHP errors in the container log
catch_workers_output = yes
decorate_workers_output = no

; small footprint, suitable for a NAS
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
