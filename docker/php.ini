; PHP settings for the Records Management system
upload_max_filesize = 20M
post_max_size       = 25M
memory_limit        = 256M
max_execution_time  = 120
expose_php          = Off

; The code inside the image never changes while it runs, so skip file checks.
opcache.enable                  = 1
opcache.validate_timestamps     = 0
opcache.memory_consumption      = 128
opcache.max_accelerated_files   = 10000
